<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ═══════════════════════════════════════════════════════
     ZMĚNIT: Název stránky a popis
════════════════════════════════════════════════════════ -->
<title>Název stránky — Unified Cloud Sensors</title>
<meta name="description" content="Popis stránky pro vyhledávače. 150–160 znaků.">

<!-- Sdílené styly — neměnit cestu -->
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!-- NAV — vkládá layout.js automaticky, nemazat -->
<div id="site-nav"></div>

<!-- ═══════════════════════════════════════════════════════
     HERO (volitelné — smazat pokud stránka hero nepotřebuje)
════════════════════════════════════════════════════════ -->
<section class="hero">
<div class="wrap">
  <h1>Nadpis stránky<br><span class="a">zvýraznění.</span></h1>
  <p>Krátký popis nebo podnadpis. Max 2 věty.</p>
  <!-- <a class="btn-pill" href="#sekce">CTA text →</a> -->
</div>
</section>

<!-- ═══════════════════════════════════════════════════════
     OBSAH STRÁNKY
     Přidávejte sekce níže.

     Dostupné třídy:
       .sec          — standardní sekce (bílé pozadí)
       .sec.sec-alt  — sekce (šedé pozadí)
       .wrap         — centrovaný kontejner 1040px
       .micro        — malý nadpis sekce (např. "Produkty")
       .sec-h        — velký nadpis sekce

     Příklad sekce:
       <section class="sec" id="moje-sekce">
         <div class="wrap">
           <div class="micro">Kategorie</div>
           <div class="sec-h">Nadpis sekce</div>
           <p>Obsah...</p>
         </div>
       </section>
════════════════════════════════════════════════════════ -->

<section class="sec">
<div class="wrap">
  <div class="micro">Kategorie</div>
  <div class="sec-h">Nadpis sekce</div>
  <p style="color:var(--text2);max-width:600px;line-height:1.7">
    Zde začíná obsah stránky. Tuto sekci smazat nebo upravit.
  </p>
</div>
</section>

<!-- FOOTER — vkládá layout.js automaticky, nemazat -->
<div id="site-footer"></div>

<!-- Scripts — neměnit pořadí -->
<script src="assets/js/layout.js"></script>
<!-- Přidat další scripty zde pokud je stránka potřebuje -->

</body>
</html>
