name: Deploy sensbelt.unifiedcloudsensors.com to AWS
run-name: Deploy sensbelt No. ${{ github.run_number }} by @${{ github.actor }}

# Auto-deploys on every push to main that touches the deck itself — this is
# a standalone product presentation, not gated behind the manual-dispatch
# convention sensweight.com/unifiedcloudsensors.com use. workflow_dispatch
# stays available for manual re-runs (e.g. re-invalidating cache alone).
on:
  push:
    branches: [main]
    paths:
      - "unifiedcloudsensors/sensbelt/**"
      - ".github/workflows/deploy-sensbelt.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      APP_DIR: unifiedcloudsensors/sensbelt

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-session-name: "github-actions-sensbelt-deploy"
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ vars.AWS_ACCESS_ROLE_ARN }}

      - name: Sync to S3
        run: |
          aws s3 sync ${{ env.APP_DIR }} s3://${{ vars.SENSBELT_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.SENSBELT_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** ${{ vars.SENSBELT_LIVE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 bucket:** \`${{ vars.SENSBELT_S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
