name: Deploy sensweight.com to AWS
run-name: Deploy sensweight.com No. ${{ github.run_number }} by @${{ github.actor }}

# Manual only, on purpose — going live is a deliberate step (the /deploy-live
# command), separate from merging a task branch into main.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      APP_DIR: sensweight

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json'

      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          npm ci

      - name: Build site
        run: |
          cd ${{ env.APP_DIR }}
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-session-name: "github-actions-sensweight-deploy"
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ vars.AWS_ACCESS_ROLE_ARN }}

      - name: Sync to S3
        run: |
          aws s3 sync ${{ env.APP_DIR }}/_site s3://${{ vars.SENSWEIGHT_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.SENSWEIGHT_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** ${{ vars.SENSWEIGHT_LIVE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 bucket:** \`${{ vars.SENSWEIGHT_S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
